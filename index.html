<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificador de Sets de Fotografías</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>CALIFICADOR DE FOTOGRAFÍAS</h1>
        
        <div class="drop-zone" id="dropZone">
            <h2>Arrastra tus fotografías aquí</h2>
            <p>Hasta 4 imágenes simultáneamente</p>
        </div>

        <div class="score-summary" id="scoreSummary">
            <h2>Calificación Final</h2>
            <div class="final-score" id="finalScore">0.0</div>
            <div class="status-text" id="statusText">Promedio de las 4 fotografías</div>
        </div>

        <div class="photos-grid" id="photosGrid">
            <!-- Las tarjetas de fotos se generarán aquí -->
        </div>

        <!-- Modal para ver foto en grande -->
        <div class="modal" id="photoModal" onclick="closeModal()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <img class="modal-content" id="modalImage">
        </div>

        <button class="weights-toggle-btn" id="weightsToggleBtn" onclick="toggleWeights()">
            Mostrar Ponderaciones
        </button>

        <div class="weights-section collapsed" id="weightsSection">
            <h3>Ponderaciones de Parámetros</h3>
            <p style="margin-bottom: 20px; color: #606060; font-size: 0.9em; font-weight: 300;">Ajusta la importancia de cada parámetro (valores entre 0.1 y 2.0)</p>
            <div class="weight-item">
                <label>Vista:</label>
                <input type="number" id="weight_distance" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="weight-item">
                <label>Iluminación:</label>
                <input type="number" id="weight_lighting" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="weight-item">
                <label>Nitidez:</label>
                <input type="number" id="weight_sharpness" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="weight-item">
                <label>Visibilidad de alrededores:</label>
                <input type="number" id="weight_surroundings" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="weight-item">
                <label>Tomada sobre la vía:</label>
                <input type="number" id="weight_onroad" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="weight-item">
                <label>Vehículos visibles:</label>
                <input type="number" id="weight_vehicles" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="weight-item">
                <label>Formato horizontal:</label>
                <input type="number" id="weight_orientation" value="1.0" step="0.1" min="0.1" max="2.0">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
