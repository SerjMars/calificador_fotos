name: Deploy a Firebase Hosting

on:
  push:
    branches:
      - master   # Despliega automáticamente cuando se hace push a master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CALIFICADOR_DE_FOTOS }}
          channelId: live
          projectId: calificador-de-fotos
